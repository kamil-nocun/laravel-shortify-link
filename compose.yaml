services:
  mysql:
    image: mysql:8.4
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-shortify_link}"
      MYSQL_USER: "${DB_USERNAME:-shortify_link}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-shortify_link}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-shortify_link}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-shortify_link}"]
      interval: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
